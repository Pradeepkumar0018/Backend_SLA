<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Logical & Business Logic Tasks</title>
</head>

<body>

    <h1>JavaScript – Logical & Business Logic Tasks</h1>

    <div id="output"></div>

    <script>

        let output = document.getElementById("output");


        // ==================================================
        // TASK 1 – ELECTRICITY BILL CALCULATION
        // ==================================================

        let customerName = "Pradeep";
        let unitsConsumed = 250;
        let bill = 0;

        if (unitsConsumed <= 100) {
            bill = unitsConsumed * 2;
        }
        else if (unitsConsumed <= 200) {
            bill = (100 * 2) + ((unitsConsumed - 100) * 3);
        }
        else {
            bill = (100 * 2) + (100 * 3) + ((unitsConsumed - 200) * 5);
        }

        output.innerHTML += `
            <h2>Task 1 – Electricity Bill</h2>
            Customer Name: ${customerName}<br>
            Units Consumed: ${unitsConsumed}<br>
            Electricity Bill: ₹${bill}
            <hr>
        `;


        // ==================================================
        // TASK 2 – ATM CASH WITHDRAWAL
        // ==================================================

        let balance = 15000;
        let withdrawAmount = 4000;

        output.innerHTML += `
            <h2>Task 2 – ATM Cash Withdrawal</h2>
        `;

        if (withdrawAmount <= 0) {
            output.innerHTML += "Invalid withdrawal amount";
        }
        else if (withdrawAmount % 500 !== 0) {
            output.innerHTML += "Amount must be a multiple of 500";
        }
        else if (withdrawAmount > balance) {
            output.innerHTML += "Insufficient balance";
        }
        else {
            balance = balance - withdrawAmount;

            output.innerHTML += `
                Withdrawal Successful<br>
                Withdrawn Amount: ₹${withdrawAmount}<br>
                Remaining Balance: ₹${balance}
            `;
        }

        output.innerHTML += "<hr>";


        // ==================================================
        // TASK 3 – EMPLOYEE LOGIN ATTEMPTS
        // ==================================================

        let correctPin = 1234;
        let enteredPins = [1111, 2222, 1234];

        output.innerHTML += `
            <h2>Task 3 – Employee Login</h2>
        `;

        for (let i = 0; i < 3; i++) {

            let enteredPin = enteredPins[i];

            if (enteredPin === correctPin) {
                output.innerHTML += "Login Successful<br>";
                break;
            }
            else {
                output.innerHTML += "Incorrect PIN<br>";
            }

            if (i === 2) {
                output.innerHTML += "Account Blocked<br>";
            }
        }

        output.innerHTML += "<hr>";


        // ==================================================
        // TASK 4 – MULTIPLICATION BILL TABLE
        // ==================================================

        let productPrice = 250;

        output.innerHTML += `
            <h2>Task 4 – Multiplication Bill Table</h2>
        `;

        for (let quantity = 1; quantity <= 5; quantity++) {

            let totalPrice = quantity * productPrice;

            output.innerHTML += `
                Quantity ${quantity} = ₹${totalPrice}<br>
            `;
        }

        output.innerHTML += "<hr>";


        // ==================================================
        // TASK 5 – SEAT BOOKING DISPLAY
        // ==================================================

        let rows = 3;
        let seats = 5;

        output.innerHTML += `
            <h2>Task 5 – Seat Booking Display</h2>
        `;

        for (let row = 1; row <= rows; row++) {

            for (let seat = 1; seat <= seats; seat++) {

                output.innerHTML += `
                    Row ${row} - Seat ${seat}<br>
                `;
            }
        }

        output.innerHTML += "<hr>";


        // ==================================================
        // TASK 6 – DELIVERY CHARGE FUNCTION
        // ==================================================

        function calculateDelivery(amount) {

            let deliveryCharge;

            if (amount >= 1000) {
                deliveryCharge = 0;
            }
            else if (amount >= 500) {
                deliveryCharge = 50;
            }
            else {
                deliveryCharge = 100;
            }

            return amount + deliveryCharge;
        }

        let orderAmount = 700;
        let finalAmount = calculateDelivery(orderAmount);

        output.innerHTML += `
            <h2>Task 6 – Delivery Charge</h2>
            Order Amount: ₹${orderAmount}<br>
            Final Payable Amount: ₹${finalAmount}
            <hr>
        `;


        // ==================================================
        // TASK 7 – FIND HIGHEST SALES
        // ==================================================

        let sales = [12000, 18000, 9500, 25000, 16000];

        let highestSales = sales[0];

        for (let i = 1; i < sales.length; i++) {

            if (sales[i] > highestSales) {
                highestSales = sales[i];
            }
        }

        output.innerHTML += `
            <h2>Task 7 – Highest Sales</h2>
            Sales: ${sales}<br>
            Highest Sales: ₹${highestSales}
            <hr>
        `;


        // ==================================================
        // TASK 8 – PALINDROME ARRAY
        // ==================================================

        let numbers = [1, 2, 3, 2, 1];

        let isPalindrome = true;

        for (let i = 0; i < numbers.length / 2; i++) {

            if (numbers[i] !== numbers[numbers.length - 1 - i]) {

                isPalindrome = false;
                break;
            }
        }

        output.innerHTML += `
            <h2>Task 8 – Palindrome Array</h2>
            Array: ${numbers}<br>
        `;

        if (isPalindrome) {
            output.innerHTML += "Result: Palindrome";
        }
        else {
            output.innerHTML += "Result: Not Palindrome";
        }

        output.innerHTML += "<hr>";


        // ==================================================
        // TASK 9 – STUDENT RESULT PROCESSING
        // ==================================================

        let marks = [45, 78, 32, 90, 67];

        let graceMarks = marks.map(function(mark) {
            return mark + 5;
        });

        let passedMarks = graceMarks.filter(function(mark) {
            return mark >= 50;
        });

        output.innerHTML += `
            <h2>Task 9 – Student Result Processing</h2>
            Original Marks: ${marks}<br>
            After Grace Marks: ${graceMarks}<br>
            Marks 50 or Above: ${passedMarks}
            <hr>
        `;


        // ==================================================
        // TASK 10 – EMPLOYEE SEARCH
        // ==================================================

        let employees = [

            {
                id: 101,
                name: "Arun",
                salary: 25000
            },

            {
                id: 102,
                name: "Priya",
                salary: 35000
            },

            {
                id: 103,
                name: "Kumar",
                salary: 30000
            }

        ];

        let employee = employees.find(function(emp) {

            return emp.id === 102;

        });

        output.innerHTML += `
            <h2>Task 10 – Employee Search</h2>
            Employee ID: ${employee.id}<br>
            Employee Name: ${employee.name}<br>
            Employee Salary: ₹${employee.salary}
            <hr>
        `;


        // ==================================================
        // TASK 11 – SHOPPING CART TOTAL
        // ==================================================

        let cart = [

            {
                name: "Shirt",
                price: 1000
            },

            {
                name: "Shoes",
                price: 2500
            },

            {
                name: "Bag",
                price: 1500
            }

        ];

        let cartTotal = cart.reduce(function(accumulator, item) {

            return accumulator + item.price;

        }, 0);

        output.innerHTML += `
            <h2>Task 11 – Shopping Cart Total</h2>
            Shirt: ₹1000<br>
            Shoes: ₹2500<br>
            Bag: ₹1500<br>
            Total Cart Amount: ₹${cartTotal}
            <hr>
        `;


        // ==================================================
        // TASK 12 – PRIVATE BANK BALANCE
        // ==================================================

        function createAccount() {

            let balance = 5000;

            return function(depositAmount) {

                balance = balance + depositAmount;

                return balance;
            };
        }

        let deposit = createAccount();

        let balance1 = deposit(1000);
        let balance2 = deposit(2000);
        let balance3 = deposit(500);

        output.innerHTML += `
            <h2>Task 12 – Private Bank Balance</h2>
            Initial Balance: ₹5000<br>
            After Deposit ₹1000: ₹${balance1}<br>
            After Deposit ₹2000: ₹${balance2}<br>
            After Deposit ₹500: ₹${balance3}
            <hr>
        `;


        // ==================================================
        // TASK 13 – ORDER CALLBACK
        // ==================================================

        function processOrder(productName, callback) {

            output.innerHTML += `
                <h2>Task 13 – Order Callback</h2>
                Processing ${productName}<br>
            `;

            setTimeout(function() {

                callback("Order Confirmed");

            }, 2000);
        }

        processOrder("Laptop", function(result) {

            output.innerHTML += `
                ${result}
                <hr>
            `;

        });


        // ==================================================
        // TASK 14 – PAYMENT USING PROMISE
        // ==================================================

        function makePayment(amount) {

            return new Promise(function(resolve, reject) {

                if (amount > 0) {
                    resolve("Payment Successful");
                }
                else {
                    reject("Invalid Payment Amount");
                }

            });
        }

        output.innerHTML += `
            <h2>Task 14 – Payment Using Promise</h2>
            Payment ₹2500: 
        `;

        makePayment(2500)

            .then(function(result) {

                output.innerHTML += result + "<br>";

            })

            .catch(function(error) {

                output.innerHTML += error + "<br>";

            });


        output.innerHTML += `
            Payment ₹0:
        `;

        makePayment(0)

            .then(function(result) {

                output.innerHTML += result + "<br>";

            })

            .catch(function(error) {

                output.innerHTML += error + "<br>";

            });


        output.innerHTML += "<hr>";


        // ==================================================
        // TASK 15 – COMPLETE ORDER USING ASYNC/AWAIT
        // ==================================================

        function checkStock(stock) {

            return new Promise(function(resolve, reject) {

                if (stock > 0) {
                    resolve("Stock Available");
                }
                else {
                    reject("Out of Stock");
                }

            });
        }


        async function placeOrder() {

            output.innerHTML += `
                <h2>Task 15 – Complete Order</h2>
            `;

            try {

                let result = await checkStock(10);

                output.innerHTML += `
                    ${result}<br>
                    Order Placed
                `;

            }
            catch (error) {

                output.innerHTML += error;

            }

        }

        placeOrder();

    </script>

</body>
</html>
